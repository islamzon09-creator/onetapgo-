<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة OneTapGo</title><link rel="stylesheet" href="creator.css"><style>.admin-head{display:flex;justify-content:space-between;align-items:center}.memory-row{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.memory-row h3{margin:0}.memory-row p{color:var(--muted);font-size:11px}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.row-actions a,.row-actions button{border:0;border-radius:10px;padding:9px 12px;text-decoration:none;background:#fff0f4;color:var(--pink);font:600 11px inherit}.row-actions button.archive{background:#f4f0f1;color:#876b72}.empty{text-align:center;padding:50px;color:var(--muted)}</style></head><body><header><a href="/">ONE<span>TAP</span>GO</a><b>لوحة الإدارة</b></header><main>
<section id="login" class="panel"><small>دخول المالك</small><h1>إدارة الذكريات</h1><p>أدخل بريدك وستصلك وصلة دخول آمنة.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" required placeholder="name@example.com"></label><button class="publish" style="width:100%;margin-top:16px">إرسال رابط الدخول</button></form><div id="loginMsg"></div></section>
<section id="dashboard" hidden><div class="admin-head"><div><small>كل الطلبات</small><h1>صفحات الذكريات</h1></div><button id="logout" class="ghost">خروج</button></div><a class="publish" style="display:block;text-decoration:none;text-align:center;padding:14px;border-radius:14px;margin-bottom:18px" href="/create">＋ إنشاء صفحة جديدة</a><div id="memoryRows"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
